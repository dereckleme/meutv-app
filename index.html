<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Meu IPTV</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <object id="av-player" type="application/avplay"></object>

  <!-- LOGIN -->
  <section id="login" class="screen">
    <div class="glow g1"></div><div class="glow g2"></div>
    <div class="login-hero">
      <div class="mark big"><i></i></div>
      <h1 class="wordmark">Meu<span>IPTV</span></h1>
      <p class="tagline">Canais ao vivo, filmes e séries na sua TV.</p>
      <ul class="features">
        <li><b class="dot live"></b>Ao vivo</li>
        <li><b class="dot"></b>Filmes</li>
        <li><b class="dot"></b>Séries</li>
      </ul>
    </div>
    <div class="login-card">
      <h2>Entrar</h2>
      <p class="hint">Use a URL M3U completa ou servidor, usuário e senha.</p>
      <label class="field"><span>Servidor ou URL M3U</span>
        <input id="in-server" class="f" type="text" value="http://tridcdn.online:80" placeholder="http://servidor:80">
      </label>
      <label class="field"><span>Usuário</span>
        <input id="in-user" class="f" type="text" value="231889429">
      </label>
      <label class="field"><span>Senha</span>
        <input id="in-pass" class="f" type="text" placeholder="Digite sua senha">
      </label>
      <button id="btn-login" class="f btn primary">Entrar</button>
      <div id="login-msg" class="msg"></div>
    </div>
  </section>

  <!-- PRINCIPAL -->
  <section id="main" class="screen hidden">
    <header>
      <div class="brand"><div class="mark"><i></i></div><span class="wordmark sm">Meu<span>IPTV</span></span></div>
      <nav id="tabs">
        <button class="f tab" data-tab="live">Ao vivo</button>
        <button class="f tab" data-tab="vod">Filmes</button>
        <button class="f tab" data-tab="series">Séries</button>
      </nav>
      <div class="search"><b class="ico"></b><input id="in-search" class="f" type="text" placeholder="Buscar"></div>
      <div class="clock" id="clock"></div>
      <button id="btn-logout" class="f btn ghost">Sair</button>
    </header>
    <div id="body">
      <aside id="cats" class="scroller"></aside>
      <div id="content">
        <div id="crumb"><h2 id="crumb-title"></h2><span id="status"></span></div>
        <div id="grid" class="scroller"></div>
      </div>
    </div>
  </section>

  <!-- SÉRIE -->
  <section id="detail" class="screen hidden">
    <div id="d-bg"></div>
    <div class="d-shade"></div>
    <div class="d-wrap">
      <div class="d-top">
        <div class="d-poster"><img id="d-cover" alt=""></div>
        <div class="d-info">
          <div class="badge">SÉRIE</div>
          <h1 id="d-title"></h1>
          <div id="d-meta" class="meta"></div>
          <p id="d-plot"></p>
        </div>
      </div>
      <div id="seasons"></div>
      <div id="episodes" class="scroller"></div>
    </div>
  </section>

  <!-- PLAYER -->
  <section id="player" class="hidden">
    <video id="html5" class="hidden"></video>
    <div id="p-spinner" class="hidden"><div class="spin"></div><span>Carregando</span></div>
    <div id="p-info" class="hidden"></div>
    <div id="p-error" class="hidden"></div>
  </section>

  <div id="ver"></div>
  <script src="js/app.js"></script>
</body>
</html>
